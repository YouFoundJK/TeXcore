name: Bug Report
description: Create a bug report to help us improve LaTeX Equation Referencer
labels: ["bug"]
body:
    - type: markdown
      attributes:
          value: |
              ## Before you start
              Please **make sure you are on the latest version of LaTeX Equation Referencer.**
              If you encountered the issue after you installed, updated, or reloaded the plugin, **please try restarting Obsidian before reporting the bug**.

    - type: checkboxes
      id: no-duplicate-issues
      attributes:
          label: "Please check that this issue hasn't been reported before."
          description: "The **Label filters** may help make your search more focused."
          options:
              - label: "I searched previous [Bug Reports](https://github.com/YouFoundJK/obsidian-latex-eq-refer/issues?q=state%3Aopen%20label%3Abug) and didn't find any similar reports."
                required: true

    - type: textarea
      id: expected
      attributes:
          label: Expected Behavior
          description: Tell us what **should** happen.
      validations:
          required: true

    - type: textarea
      id: what-happened
      attributes:
          label: Current behaviour
          description: |
              Tell us what happens instead of the expected behavior.
              Adding screenshots really helps.
      validations:
          required: true

    - type: textarea
      id: console
      attributes:
          label: JavaScript console output
          description: |
              Go to `View->Toggle Developer Tools` and open up the JavaScript console, reproduce your bug, and copy/paste any logs you see there.

    - type: textarea
      id: reproduce
      attributes:
          label: Steps to reproduce
          description: |
              Which exact steps can we take to reproduce the issue? The more detail you provide, the easier it will be to narrow down and fix the bug.
      validations:
          required: true

    - type: textarea
      id: markdown-sample
      attributes:
          label: Markdown/LaTeX snippet sample
          description: |
              Please provide the exact Markdown / LaTeX content or note configuration that triggers the issue.
      validations:
          required: true

    - type: checkboxes
      id: operating-systems
      attributes:
          label: Which Operating Systems are you using?
          description: You may select more than one.
          options:
              - label: macOS
              - label: Windows
              - label: Linux
              - label: Android
              - label: iOS

    - type: input
      id: obsidian-version
      attributes:
          label: Obsidian Version
          description: Which Obsidian version are you using?
          placeholder: "Enter Obsidian Version here."
      validations:
          required: true

    - type: input
      id: plugin-version
      attributes:
          label: Plugin Version
          description: Which LaTeX Equation Referencer version are you using?
          placeholder: "Enter plugin version here."
      validations:
          required: true

    - type: checkboxes
      id: other-plugins-disabled
      attributes:
          label: Checks
          description: Please confirm
          options:
              - label: I have tried it with all other plugins disabled and the error still occurs.
                required: false

    - type: textarea
      id: possible-solution
      attributes:
          label: Possible solution
          description: |
              Not obligatory, but please suggest a fix or reason for the bug, if you have an idea.

    - type: textarea
      id: comments
      attributes:
          label: Comments
          description: Anything you'd like to share that didn't fit into an above box.
